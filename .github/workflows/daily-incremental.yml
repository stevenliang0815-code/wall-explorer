name: Daily TWSE and TPEx Incremental Update

on:
  workflow_dispatch:
  schedule:
    - cron: "5 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: wall-explorer-daily-incremental
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WALL_EXPLORER_URL: ${{ vars.WALL_EXPLORER_URL }}
      OAI_SITES_AUTHORIZATION: ${{ secrets.OAI_SITES_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - name: Idempotently update both official markets in the active operational generation
        run: npm run incremental:run
