name: Daily TWSE and TPEx Incremental Update

on:
  workflow_dispatch:
    inputs:
      deferred_attempt:
        description: Consecutive automatic retries after a transient official-source failure
        required: false
        default: "0"
  schedule:
    - cron: "5 9 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: wall-explorer-daily-incremental
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WALL_EXPLORER_URL: ${{ vars.WALL_EXPLORER_URL }}
      OAI_SITES_AUTHORIZATION: ${{ secrets.OAI_SITES_AUTHORIZATION }}
      INCREMENTAL_BATCH_DATES: 20
      INCREMENTAL_DEFERRED_ATTEMPT: ${{ inputs.deferred_attempt || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - name: Update one bounded, resumable batch for both official markets
        id: incremental
        run: npm run incremental:run
      - name: Continue with the next batch
        if: steps.incremental.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DEFERRED_ATTEMPT: ${{ steps.incremental.outputs.deferred_attempt }}
        run: gh workflow run daily-incremental.yml --ref main -f deferred_attempt="${NEXT_DEFERRED_ATTEMPT:-0}"

