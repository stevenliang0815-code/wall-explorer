name: Recover Backfill 38 Multipart Failure

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/historical-backfill38-recovery.yml
      - scripts/r2-backfill38-recovery.sh
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: wall-explorer-historical-snapshot
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      R2_STORAGE_LIMIT_BYTES: "25000000000"
      R2_SAFETY_RESERVE_BYTES: "100000000"
      R2_TRANSIENT_MAX_ATTEMPTS: "8"
      BACKFILL38_MAX_VERIFIED_ABORTS: "128"
      BACKFILL38_GH_DISPATCH_MAX_ATTEMPTS: "12"
      BACKFILL38_GH_DISPATCH_MAX_DELAY_SECONDS: "60"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - name: Install R2 client
        run: python3 -m pip install --disable-pip-version-check awscli
      - name: Validate recovery implementation
        run: |
          set -euo pipefail
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do test -n "${!key:-}"; done
          bash -n scripts/r2-historical-common.sh scripts/r2-checkpoint-lifecycle.sh scripts/r2-backfill38-recovery.sh
          node --test tests/historical-lifecycle.test.mjs tests/r2-multipart-retry.test.mjs
          node --test --test-name-pattern='R2 lifecycle uses|Backfill 38 recovery' tests/automation-config.test.mjs
      - name: Abort only verified Backfill 38 uploads, chain paused batches, and resume the final slice after zero
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            bash scripts/r2-backfill38-recovery.sh recover-scheduled
          else
            bash scripts/r2-backfill38-recovery.sh recover
          fi
