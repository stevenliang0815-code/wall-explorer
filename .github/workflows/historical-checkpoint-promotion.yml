name: Historical Checkpoint Promotion

"on":
  workflow_run:
    workflows: [Historical Snapshot Backfill]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: wall-explorer-historical-snapshot
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      R2_STORAGE_LIMIT_BYTES: "25000000000"
      R2_SAFETY_RESERVE_BYTES: "100000000"
      ENABLE_HISTORICAL_BACKFILL: ${{ vars.ENABLE_HISTORICAL_BACKFILL || 'false' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check awscli
      - name: Check durable pause
        id: pause
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_PAGER=""
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" --key jobs/historical/stop.json >/dev/null 2>&1; then echo "stopped=true" >> "$GITHUB_OUTPUT"; else echo "stopped=false" >> "$GITHUB_OUTPUT"; fi
      - name: Acquire promotion lease
        if: steps.pause.outputs.stopped != 'true'
        run: bash scripts/r2-checkpoint-lifecycle.sh acquire-lease "promotion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" checkpoint-promotion
      - name: Verify, CAS-promote, re-verify, and clean previous raw
        if: steps.pause.outputs.stopped != 'true'
        run: bash scripts/r2-checkpoint-lifecycle.sh promote
      - name: Release promotion lease
        if: always() && steps.pause.outputs.stopped != 'true'
        run: bash scripts/r2-checkpoint-lifecycle.sh release-lease "promotion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Continue only when explicitly enabled and state requests backfill
        if: success() && steps.pause.outputs.stopped != 'true' && env.ENABLE_HISTORICAL_BACKFILL == 'true'
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_PAGER=""
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          state=$(aws --endpoint-url "$endpoint" s3 cp "s3://${R2_BUCKET}/jobs/historical/state.json" - --only-show-errors | jq -r .state)
          [ "$state" != BACKFILLING ] || gh workflow run historical-backfill.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Record promotion failure
        if: failure()
        run: bash scripts/r2-checkpoint-lifecycle.sh record-stop "Checkpoint verification, CAS promotion, or cleanup failed in run ${GITHUB_RUN_ID}."
