name: Historical Snapshot Finalize

"on":
  workflow_run:
    workflows: [Historical Checkpoint Promotion]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: wall-explorer-historical-snapshot
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      R2_STORAGE_LIMIT_BYTES: "25000000000"
      R2_SAFETY_RESERVE_BYTES: "100000000"
      R2_LOCAL_RESERVE_BYTES: "1000000000"
      SNAPSHOT_EXPECTED_LAST_DATE: 2025-12-28

    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check awscli
      - name: Check durable pause and 100% raw state
        id: ready
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_PAGER=""
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" --key jobs/historical/stop.json >/dev/null 2>&1; then echo "ready=false" >> "$GITHUB_OUTPUT"; elif bash scripts/r2-finalize-lifecycle.sh is-ready; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Acquire finalization lease
        if: steps.ready.outputs.ready == 'true'
        run: bash scripts/r2-checkpoint-lifecycle.sh acquire-lease "finalize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" finalize
      - name: Deterministic gzip, immutable upload, verification, promotion, and raw cleanup
        if: steps.ready.outputs.ready == 'true'
        run: bash scripts/r2-finalize-lifecycle.sh finalize
      - name: Release finalization lease
        if: always() && steps.ready.outputs.ready == 'true'
        run: bash scripts/r2-checkpoint-lifecycle.sh release-lease "finalize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Record finalization failure
        if: failure()
        run: bash scripts/r2-checkpoint-lifecycle.sh record-stop "Finalize failed in run ${GITHUB_RUN_ID}; the verified raw checkpoint remains recoverable."
