name: Historical Snapshot Garbage Collection

"on":
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only the printed unreferenced delete list
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: wall-explorer-historical-snapshot
  cancel-in-progress: false

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      GC_OWNER: gc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check awscli
      - name: Print keep and delete lists
        run: bash scripts/r2-historical-gc.sh plan | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Acquire GC lease
        if: inputs.apply == true
        run: bash scripts/r2-checkpoint-lifecycle.sh acquire-lease "$GC_OWNER" garbage-collection
      - name: Re-plan and delete only unreferenced managed objects
        if: inputs.apply == true
        env:
          GC_APPLY: "true"
        run: bash scripts/r2-historical-gc.sh apply | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release GC lease
        if: always() && inputs.apply == true
        run: bash scripts/r2-checkpoint-lifecycle.sh release-lease "$GC_OWNER"
