name: Resume Historical Snapshot Backfill

"on":
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Historical Multipart Private Classification"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: wall-explorer-historical-snapshot
  cancel-in-progress: false

jobs:
  resume:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      R2_STORAGE_LIMIT_BYTES: "25000000000"
      R2_SAFETY_RESERVE_BYTES: "100000000"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - name: Install R2 client
        run: python3 -m pip install --disable-pip-version-check awscli
      - name: Validate current-only resume architecture
        run: |
          set -euo pipefail
          bash -n scripts/r2-historical-common.sh scripts/r2-checkpoint-lifecycle.sh scripts/r2-historical-resume-current.sh
          node --test tests/historical-lifecycle.test.mjs tests/r2-multipart-retry.test.mjs
      - name: Current lifecycle and verified checkpoint gate
        id: gate
        run: |
          set -euo pipefail
          bash scripts/r2-historical-resume-current.sh gate "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Normalize the stale failed-upload state
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          bash scripts/r2-historical-resume-current.sh prepare | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove only the durable pause marker and dispatch the final Backfill segment
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          source scripts/r2-historical-common.sh
          stop_backup=$(mktemp)
          download_object "$stop_key" "$stop_backup"
          pointer_etag=$(object_etag "$checkpoint_pointer_key")
          restore_stop_on_error() {
            code=$?
            if ! object_exists "$stop_key"; then put_json_cas "$stop_backup" "$stop_key" ABSENT || true; fi
            rm -f -- "$stop_backup"
            exit "$code"
          }
          trap restore_stop_on_error ERR
          test "$(object_etag "$checkpoint_pointer_key")" = "$pointer_etag"
          r2_destructive s3api delete-object --bucket "$bucket" --key "$stop_key" >/dev/null
          ! object_exists "$stop_key"
          gh workflow run historical-backfill.yml --repo "$GITHUB_REPOSITORY" --ref main --field batch_dates=2 --field max_cycles=0
          trap - ERR
          rm -f -- "$stop_backup"
          echo "Final 0.31% Backfill dispatched; Legacy Multipart GC continues independently." >> "$GITHUB_STEP_SUMMARY"
