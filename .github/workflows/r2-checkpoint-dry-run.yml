name: Historical Lifecycle Dry Run

"on":
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/historical-*.yml"
      - ".github/workflows/r2-checkpoint-dry-run.yml"
      - "scripts/historical-lifecycle.mjs"
      - "scripts/r2-*-lifecycle.sh"
      - "scripts/r2-historical-*.sh"
      - "scripts/r2-legacy-multipart-gc.sh"
      - "scripts/r2-backfill38-recovery.sh"
      - "tests/historical-lifecycle.test.mjs"
      - "tests/automation-config.test.mjs"
  push:
    paths:
      - ".github/workflows/historical-*.yml"
      - ".github/workflows/r2-checkpoint-dry-run.yml"
      - "scripts/historical-lifecycle.mjs"
      - "scripts/r2-*-lifecycle.sh"
      - "scripts/r2-historical-*.sh"
      - "scripts/r2-legacy-multipart-gc.sh"
      - "scripts/r2-backfill38-recovery.sh"
      - "tests/historical-lifecycle.test.mjs"
      - "tests/automation-config.test.mjs"

permissions:
  contents: read

concurrency:
  group: wall-explorer-historical-lifecycle-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      R2_STORAGE_LIMIT_BYTES: "25000000000"
      R2_SAFETY_RESERVE_BYTES: "100000000"

    steps:
      - uses: actions/checkout@v4
      - name: Static architecture and failure tests
        run: |
          set -euo pipefail
          bash -n scripts/r2-historical-common.sh scripts/r2-checkpoint-lifecycle.sh scripts/r2-finalize-lifecycle.sh scripts/r2-historical-gc.sh scripts/r2-historical-resume-current.sh scripts/r2-historical-lifecycle-rule.sh scripts/r2-legacy-multipart-gc.sh
          node --test tests/historical-lifecycle.test.mjs
          node --test --test-name-pattern='R2 lifecycle uses|Backfill 38 recovery|dry-run measures' tests/automation-config.test.mjs
          ! grep -R -E 'copy-object|s3 cp "s3://[^ ]+" "s3://' scripts/r2-*-lifecycle.sh scripts/r2-historical-common.sh
          grep -F -- '--if-match' scripts/r2-historical-common.sh
          grep -F -- '--if-none-match' scripts/r2-historical-common.sh
          grep -F 'abort-multipart-upload' scripts/r2-historical-common.sh
          grep -F 'cleanupPending' scripts/r2-historical-common.sh
      - name: Install read-only R2 client
        run: python3 -m pip install --disable-pip-version-check awscli
      - name: Read-only measured peak and GC plan
        if: env.R2_ACCOUNT_ID != '' && env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' && env.R2_BUCKET != ''
        shell: bash
        run: |
          set -euo pipefail
          resolved=$(bash scripts/r2-checkpoint-lifecycle.sh resolve)
          bytes=$(node -e 'const d=JSON.parse(process.argv[1]);process.stdout.write(String(d.bytes))' "$resolved")
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_PAGER=""
          expected_bytes="$bytes"
          if aws --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" --key jobs/historical/pending-checkpoint.json >/dev/null 2>&1; then
            expected_bytes=0
            echo "Pending checkpoint detected; measuring promotion/cleanup peak without proposing a forbidden third raw." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "Measuring current lifecycle unfinished multipart only; legacy multipart is handled by independent GC." | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/r2-checkpoint-lifecycle.sh projected-peak "$expected_bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/r2-historical-gc.sh plan | tee -a "$GITHUB_STEP_SUMMARY"
          echo "No object, pointer, state, lease, multipart upload, or Backfill job was mutated." >> "$GITHUB_STEP_SUMMARY"
