name: R2 Checkpoint 25 GB Dry Run

"on":
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/r2-checkpoint-dry-run.yml"
      - ".github/workflows/historical-backfill.yml"
      - "scripts/r2-snapshot-store.sh"
  push:
    paths:
      - ".github/workflows/r2-checkpoint-dry-run.yml"
      - ".github/workflows/historical-backfill.yml"
      - "scripts/r2-snapshot-store.sh"

permissions:
  contents: read

concurrency:
  group: wall-explorer-r2-checkpoint-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
      R2_STORAGE_LIMIT_BYTES: "25000000000"
      R2_NEXT_BATCH_RESERVE_BYTES: "100000000"
      AWS_MAX_ATTEMPTS: "3"
      AWS_RETRY_MODE: standard

    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!key:-}" ]; then
              echo "Required GitHub secret is missing: $key" >&2
              exit 1
            fi
          done

      - name: Install S3-compatible client
        run: python3 -m pip install --disable-pip-version-check awscli

      - name: Validate immutable promotion architecture
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/r2-snapshot-store.sh
          checkpoint_body=$(sed -n '/^write_checkpoint()/,/^case /p' scripts/r2-snapshot-store.sh)
          if grep -Eq 'delete-object|s3 rm|copy-object|s3 cp "s3://[^ ]+" "s3://' <<< "$checkpoint_body"; then
            echo "::error::Checkpoint promotion still contains a destructive action or R2-to-R2 copy." >&2
            exit 1
          fi
          grep -F 'checkpoint_versions_prefix' scripts/r2-snapshot-store.sh >/dev/null
          grep -F 'latest_pointer_key' scripts/r2-snapshot-store.sh >/dev/null

      - name: Read-only inventory and immutable checkpoint projection
        shell: bash
        run: |
          set -euo pipefail
          output=$(bash scripts/r2-snapshot-store.sh promotion-dry-run)
          printf '%s\n' "$output"
          {
            echo "## Immutable checkpoint promotion dry-run"
            echo
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
            echo
            echo "No R2 object was uploaded, copied, replaced, pointed to, or deleted."
          } >> "$GITHUB_STEP_SUMMARY"
