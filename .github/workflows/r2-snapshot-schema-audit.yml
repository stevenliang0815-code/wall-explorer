name: R2 Historical Snapshot Read-only Schema Audit
"on":
  push:
    branches: [audit/r2-snapshot-readonly-20260908]
    paths: [.github/workflows/r2-snapshot-schema-audit.yml]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: r2-snapshot-schema-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install read client
        run: python3 -m pip install --disable-pip-version-check boto3
      - name: Verify official snapshot and inspect SQLite read-only
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || secrets.R2_BUCKET }}
        shell: python
        run: |
          """R2 GET/HEAD only; report aggregates, never retain the downloaded snapshot."""
          import datetime
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import sqlite3
          import tempfile
          
          import boto3
          from botocore.config import Config
          
          
          def check(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def sha(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()
          
          
          def qi(name):
              return '"' + name.replace('"', '""') + '"'
          
          
          def audit(db):
              connection = sqlite3.connect(db.as_uri() + '?mode=ro&immutable=1', uri=True)
              connection.row_factory = sqlite3.Row
              connection.execute('PRAGMA query_only=ON')
              def rows(query):
                  return [dict(row) for row in connection.execute(query)]
              try:
                  integrity = [row[0] for row in connection.execute('PRAGMA integrity_check')]
                  check(integrity == ['ok'], 'SQLite integrity failed')
                  result = {'integrityCheck': integrity, 'schemaVersion': connection.execute('PRAGMA user_version').fetchone()[0],
                            'schema': rows("SELECT type,name,tbl_name,sql FROM sqlite_master ORDER BY type,name"), 'tables': {}}
                  for table in rows("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"):
                      name = table['name']
                      quoted = qi(name)
                      print('AUDIT_TABLE_START=' + name, flush=True)
                      columns = rows('PRAGMA table_info(' + quoted + ')')
                      count = connection.execute('SELECT count(*) FROM ' + quoted).fetchone()[0]
                      item = {'rowCount': count, 'columns': columns, 'indexes': rows('PRAGMA index_list(' + quoted + ')'), 'dates': {}}
                      for index in item['indexes']:
                          index['columns'] = rows('PRAGMA index_info(' + qi(index['name']) + ')')
                      if columns:
                          nulls = rows('SELECT ' + ','.join('sum(' + qi(c['name']) + ' IS NULL) AS ' + qi(c['name']) for c in columns) + ' FROM ' + quoted)[0]
                          item['nullCounts'] = nulls
                      names = {c['name'] for c in columns}
                      for column in columns:
                          col = column['name']
                          if re.search(r'date|timestamp|_at$|usable_from|effective|published|announced', col, re.I):
                              c = qi(col)
                              item['dates'][col] = rows('SELECT min(' + c + ') AS first,max(' + c + ') AS last,count(DISTINCT ' + c + ') AS distinctValues FROM ' + quoted)[0]
                      if {'market', 'trading_date'} <= names:
                          extras = ',count(DISTINCT code) AS securities' if 'code' in names else ''
                          item['yearMarket'] = rows('SELECT substr(trading_date,1,4) AS year,market,count(*) AS rows,count(DISTINCT trading_date) AS dates,min(trading_date) AS first,max(trading_date) AS last' + extras + ' FROM ' + quoted + ' GROUP BY 1,2 ORDER BY 1,2')
                          item['daily2025'] = rows("SELECT market,trading_date,count(*) AS rows" + extras + ' FROM ' + quoted + " WHERE trading_date>='2025-01-01' AND trading_date<'2026-01-01' GROUP BY 1,2 ORDER BY 1,2")
                          for field in ('security_type', 'universe_status', 'source', 'source_scope', 'status'):
                              if field in names:
                                  item[field + '2025'] = rows('SELECT market,' + qi(field) + ',count(*) AS rows FROM ' + quoted + " WHERE trading_date>='2025-01-01' AND trading_date<'2026-01-01' GROUP BY 1,2 ORDER BY 1,2")
                          if 'code' in names:
                              item['duplicateKeyGroups'] = connection.execute('SELECT count(*) FROM (SELECT 1 FROM ' + quoted + ' GROUP BY market,code,trading_date HAVING count(*)>1)').fetchone()[0]
                              fields = [c['name'] for c in columns]
                              item['nulls2025ByMarket'] = rows('SELECT market,count(*) AS rows,' + ','.join('sum(' + qi(c) + ' IS NULL) AS ' + qi(c) for c in fields if c != 'market') + ' FROM ' + quoted + " WHERE trading_date>='2025-01-01' AND trading_date<'2026-01-01' GROUP BY market")
                              if {'open', 'high', 'low', 'close', 'volume'} <= names:
                                  item['priceChecks2025'] = rows('SELECT market,count(*) AS rows,sum(close<=0) AS nonpositiveClose,sum(high<low) AS highBelowLow,sum(volume<0) AS negativeVolume FROM ' + quoted + " WHERE trading_date>='2025-01-01' AND trading_date<'2026-01-01' GROUP BY market")
                          if {'usable_from', 'trading_date'} <= names:
                              item['usableFromRelation2025'] = rows('SELECT market,sum(usable_from IS NULL) AS unknown,sum(substr(usable_from,1,10)<trading_date) AS beforeDate,sum(substr(usable_from,1,10)=trading_date) AS sameDate,sum(substr(usable_from,1,10)>trading_date) AS afterDate FROM ' + quoted + " WHERE trading_date>='2025-01-01' AND trading_date<'2026-01-01' GROUP BY market")
                      result['tables'][name] = item
                  return result
              finally:
                  connection.close()
          
          
          def main():
              output = Path('audit-report.json')
              report = {'auditVersion': '1', 'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'allowedR2Operations': ['HeadObject', 'GetObject']}
              temp = Path(tempfile.mkdtemp(prefix='r2-schema-audit-', dir=os.environ['RUNNER_TEMP'])).resolve()
              client = boto3.client('s3', endpoint_url='https://' + os.environ['R2_ACCOUNT_ID'] + '.r2.cloudflarestorage.com',
                                    aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
                                    region_name='auto', config=Config(retries={'mode': 'standard', 'max_attempts': 4}))
              def readonly(model, **kwargs):
                  check(model.name in ('HeadObject', 'GetObject'), 'Forbidden R2 API operation')
              client.meta.events.register('before-call.s3.*', readonly)
              bucket = os.environ['R2_BUCKET']
              def get(key):
                  check(key.startswith('snapshots/historical/'), 'Unexpected object prefix')
                  response = client.get_object(Bucket=bucket, Key=key)
                  try:
                      return response['Body'].read()
                  finally:
                      response['Body'].close()
              try:
                  pointer_bytes = get('snapshots/historical/latest.json')
                  pointer = json.loads(pointer_bytes)
                  check(pointer.get('status') == 'verified' and pointer.get('progress') == 100 and pointer.get('compression') == 'gzip-9-n', 'Pointer is not a verified official snapshot')
                  key = pointer['objectKey']
                  check(re.fullmatch(r'snapshots/historical/versions/builder-[a-f0-9]{64}\.sqlite\.gz', key), 'Invalid snapshot key')
                  check(pointer['manifestKey'] == key + '.manifest.json', 'Unexpected manifest key')
                  manifest = json.loads(get(pointer['manifestKey']))
                  fields = ('version', 'objectKey', 'compressedBytes', 'compressedSha256', 'rawBytes', 'rawSha256', 'rows', 'lastDate', 'schemaVersion', 'progress', 'compression', 'manifestKey')
                  for field in fields:
                      check(pointer[field] == manifest[field], 'Pointer/manifest mismatch: ' + field)
                  check(key.endswith('builder-' + pointer['rawSha256'] + '.sqlite.gz'), 'Key/raw hash mismatch')
                  checksum = get(key + '.sha256').decode('ascii').strip().split()[0]
                  check(checksum == pointer['compressedSha256'], 'Checksum sidecar mismatch')
                  head = client.head_object(Bucket=bucket, Key=key)
                  check(head['ContentLength'] == pointer['compressedBytes'], 'Head size mismatch')
                  check(shutil.disk_usage(temp).free > pointer['compressedBytes'] + pointer['rawBytes'] + 1024**3, 'Insufficient temporary disk')
                  report['snapshot'] = {field: pointer[field] for field in fields}
                  report['snapshot']['etag'] = head['ETag']
                  report['snapshot']['lastModified'] = head['LastModified'].isoformat()
                  report['pointerSha256'] = hashlib.sha256(pointer_bytes).hexdigest()
                  archive, db = temp / 'snapshot.sqlite.gz', temp / 'snapshot.sqlite'
                  response = client.get_object(Bucket=bucket, Key=key, IfMatch=head['ETag'])
                  try:
                      with archive.open('wb') as stream:
                          shutil.copyfileobj(response['Body'], stream, length=8*1024*1024)
                  finally:
                      response['Body'].close()
                  check(archive.stat().st_size == pointer['compressedBytes'] and sha(archive) == checksum, 'Compressed checksum/size mismatch')
                  with gzip.open(archive, 'rb') as source, db.open('wb') as target:
                      shutil.copyfileobj(source, target, length=8*1024*1024)
                  check(db.stat().st_size == pointer['rawBytes'] and sha(db) == pointer['rawSha256'], 'Raw checksum/size mismatch')
                  print('SNAPSHOT_VERIFICATION=passed', flush=True)
                  report['sqlite'] = audit(db)
                  check(report['sqlite']['tables']['historical_observations']['rowCount'] == pointer['rows'], 'Manifest row count mismatch')
                  report['pointerUnchangedAtEnd'] = get('snapshots/historical/latest.json') == pointer_bytes
                  report['status'] = 'verified_schema_audit_complete'
              finally:
                  # Only the freshly-created exact runner temp directory is deleted.
                  check(temp.parent == Path(os.environ['RUNNER_TEMP']).resolve() and temp.name.startswith('r2-schema-audit-'), 'Unsafe cleanup path')
                  shutil.rmtree(temp)
                  report['temporarySnapshotDeleted'] = not temp.exists()
                  output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  print('AUDIT_REPORT=' + json.dumps(report, ensure_ascii=False, separators=(',', ':')), flush=True)
          
          
          if __name__ == '__main__':
              main()
      - name: Ensure snapshot temporary files are removed
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          for candidate in root.glob("r2-schema-audit-*"):
              assert candidate.resolve().parent == root and not candidate.is_symlink()
              shutil.rmtree(candidate)
          assert not list(root.glob("r2-schema-audit-*"))
          print("SNAPSHOT_TEMP_CLEANUP=passed")
      - name: Retain aggregate report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-schema-audit-report
          path: audit-report.json
          if-no-files-found: error
          retention-days: 7
